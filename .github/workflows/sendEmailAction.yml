name: Send ICS

on:
  push:
    paths:
      - '**/*.md'
      - 'scripts/**/*.py'

  workflow_dispatch:
    inputs:
      full_refresh:
        description: 'Force full refresh (rebuild all events)'
        required: false
        type: boolean
        default: false


permissions:
  contents: write


jobs:

  build-and-send:

    runs-on: ubuntu-latest


    steps:

      # --------------------------------------------------------------
      # Checkout repository
      # --------------------------------------------------------------

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2



      # --------------------------------------------------------------
      # Setup Python
      # --------------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'



      # --------------------------------------------------------------
      # Install dependencies
      # --------------------------------------------------------------

      - name: Install dependencies
        run: |
          pip install azure-communication-email icalendar



      # --------------------------------------------------------------
      # Debug repository contents
      # --------------------------------------------------------------

      - name: Debug
        run: |
          pwd
          ls -R
          python --version



      # --------------------------------------------------------------
      # Generate calendars
      # --------------------------------------------------------------

      - name: Generate calendars and send Outlook ICS

        env:

          AZURE_COMMUNICATION_CONNECTION_STRING: ${{ secrets.AZURE_COMMUNICATION_CONNECTION_STRING }}

          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}

          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}


        run: |
          # If triggered manually and full_refresh is true, pass --full argument
          if [ "${{ github.event.inputs.full_refresh }}" = "true" ]; then
            echo "Running with FULL REFRESH..."
            python scripts/sendEmail.py . --full
          else
            echo "Running incrementally..."
            python scripts/sendEmail.py .
          fi



      # --------------------------------------------------------------
      # Commit iCloud calendar feed
      # --------------------------------------------------------------

      - name: Commit iCloud calendar feed

        run: |

          if [ -f "docs/time.ics" ]; then


            git config user.name "github-actions[bot]"

            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


            git add docs/time.ics


            git commit -m "Update iCloud calendar feed" || echo "No changes"


            git push


          else

            echo "docs/time.ics was not generated."

            exit 1

          fi