name: Send ICS

on:
  push:
    paths:
      - '**/*.md'
  workflow_dispatch:

jobs:
  build-and-send:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install azure-communication-email icalendar

      - name: Get modified markdown files
        id: changed-files
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            files=$(find . -name "*.md")
          else
            files=$(git diff --name-only HEAD^ HEAD | grep '.*\.md$' || true)
          fi

          if [ -z "$files" ]; then
            echo "No markdown files found."
            exit 0
          fi

          echo "Markdown files to process:"
          echo "$files"

          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$files" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Debug
        run: |
          pwd
          ls -R
          python --version
          echo "Files selected:"
          echo "${{ steps.changed-files.outputs.files }}"

      - name: Send ICS Email
        env:
          AZURE_COMMUNICATION_CONNECTION_STRING: ${{ secrets.AZURE_COMMUNICATION_CONNECTION_STRING }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          while IFS= read -r file; do
            if [ -n "$file" ]; then
              echo "Sending ICS for: $file"
              python scripts/sendEmail.py "$file"
            fi
          done <<< "${{ steps.changed-files.outputs.files }}"