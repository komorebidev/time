name: Send ICS

on:
  push:
    paths:
      - 'time/**/*.md'
  workflow_dispatch:

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install azure-communication-email icalendar

      - name: Get modified markdown file
        id: changed-file
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            file=$(find . -name "*.md" | head -n 1)
          else
            # Adjusted for working-directory: time
            file=$(git diff --name-only HEAD^ HEAD | grep '^time/.*\.md$' | sed 's|^time/||' | tail -n 1)
          fi
          
          if [ -z "$file" ]; then
            file=$(find . -name "*.md" | head -n 1)
          fi

          echo "file=$file" >> $GITHUB_OUTPUT
          echo "Using file: $file"

      - name: Debug
 
        run: |
          pwd
          ls -R
          python --version    
          
      - name: Send ICS Email
        env:
          AZURE_COMMUNICATION_CONNECTION_STRING: ${{ secrets.AZURE_COMMUNICATION_CONNECTION_STRING }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          python time/scripts/sendEmail.py "${{ steps.changed-file.outputs.file }}"