name: Send ICS

on:
  push:
    paths:
      - 'time/**/*.md'

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install azure-communication-email icalendar

      - name: Get modified markdown file
        id: changed-file
        run: |
          file=$(git diff --name-only HEAD^ HEAD | grep '^time/.*\.md$' | tail -n 1)
          echo "file=$file" >> $GITHUB_OUTPUT

      - name: Send ICS Email
        env:
          AZURE_COMMUNICATION_CONNECTION_STRING: ${{ secrets.AZURE_COMMUNICATION_CONNECTION_STRING }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          python sendEmail.py "${{ steps.changed-file.outputs.file }}"